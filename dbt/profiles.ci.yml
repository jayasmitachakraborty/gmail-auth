# CI dbt profile. No secrets — `project` and `keyfile` come from env vars.
jobs_pipeline:
  target: prod
  outputs:
    prod:
      type: bigquery
      method: service-account
      project: "{{ env_var('DBT_PROJECT') }}"
      dataset: gmail_staging
      keyfile: "{{ env_var('DBT_SA_KEYFILE') }}"
      location: US
      threads: 8

# CI-only dbt profile. Committed because it contains no secrets — both
# `project` and `keyfile` are resolved from env vars at runtime.
# Used by `.github/workflows/ci.yml` and `.github/workflows/ingest-and-build.yml`.
# For local development, copy `profiles.yml.example` to `profiles.yml` instead.
jobs_pipeline:
  target: prod
  outputs:
    prod:
      type: bigquery
      method: service-account
      project: "{{ env_var('DBT_PROJECT') }}"
      dataset: gmail_staging
      keyfile: "{{ env_var('DBT_SA_KEYFILE') }}"
      location: US
      threads: 8

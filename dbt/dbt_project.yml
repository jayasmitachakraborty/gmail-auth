name: jobs_pipeline
version: "1.0.0"
profile: jobs_pipeline

model-paths: ["models"]
macro-paths: ["macros"]

vars:
  # Days with no follow-up after applied_at before a thread is treated as
  # "no response" in mart_job_applications.
  no_response_days: 14

models:
  jobs_pipeline:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: ephemeral
    marts:
      +schema: marts
      +materialized: table

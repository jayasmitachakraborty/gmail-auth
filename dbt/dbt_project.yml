name: jobs_pipeline
version: "1.0.0"
profile: jobs_pipeline

model-paths: ["models"]
macro-paths: ["macros"]

vars:
  # Days with no follow-up after applied_at before a thread is treated as
  # "no response" in mart_job_applications. Override with `--vars` on the
  # command line, e.g. `dbt build --vars '{"no_response_days": 21}'`.
  no_response_days: 14

models:
  jobs_pipeline:
    staging:
      +schema: gmail_staging
      +materialized: view
    intermediate:
      +schema: gmail_intermediate
      +materialized: ephemeral
    marts:
      +schema: gmail_marts
      +materialized: table
      +partition_by:
        field: received_at
        data_type: timestamp
        granularity: day
      +cluster_by: ["job_pipeline_category", "sender"]

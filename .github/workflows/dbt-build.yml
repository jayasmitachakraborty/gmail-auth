# Manually run `dbt build --target prod` against BigQuery.
name: dbt build

on:
  workflow_dispatch:

jobs:
  dbt-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DBT_PROJECT: jobs-and-career-494813

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - run: pip install -r dbt/requirements.txt

      - name: Configure dbt
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          printf '%s' "$GCP_SA_KEY" > "${RUNNER_TEMP}/key.json"
          echo "DBT_SA_KEYFILE=${RUNNER_TEMP}/key.json" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.dbt"
          cp dbt/profiles.ci.yml "$HOME/.dbt/profiles.yml"

      - name: dbt build
        run: |
          cd dbt
          dbt deps
          dbt build --target prod
